services:
  # 1. Managed PostgreSQL Database
  - type: postgres
    name: runwaykeeper-db
    plan: free
    databaseName: runwaykeeper
    user: runwaykeeper

  # 2. Streamlit Web Application (Full UI & Operations Hub)
  - type: web
    name: runwaykeeper-streamlit
    env: docker
    plan: free
    dockerfilePath: Dockerfile.streamlit
    dockerContext: .
    healthCheckPath: /_stcore/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: runwaykeeper-db
          property: connectionString
      - key: PORT
        value: "8501"
      - key: WORKSPACE_MODE
        value: "simulation"
      - key: DEMO_API_KEY
        value: "rk_demo_harbor_studio"
      - key: AWS_REGION
        value: "us-west-2"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false

  # 3. FastAPI REST API (For Webhooks, External integrations & Headless clients)
  - type: web
    name: runwaykeeper-api
    env: docker
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: runwaykeeper-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: "8000"
      - key: WORKSPACE_MODE
        value: "simulation"
      - key: DEMO_API_KEY
        value: "rk_demo_harbor_studio"
      - key: AWS_REGION
        value: "us-west-2"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false

  # 4. Durable Background Worker Service
  - type: worker
    name: runwaykeeper-worker
    env: docker
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    dockerCommand: python -m worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: runwaykeeper-db
          property: connectionString
      - key: WORKSPACE_MODE
        value: "simulation"
      - key: AWS_REGION
        value: "us-west-2"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
