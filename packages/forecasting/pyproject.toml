[project]
name = "runwaykeeper-forecasting"
version = "0.1.0"
description = "Deterministic cash-flow forecasting for RunwayKeeper"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["runwaykeeper_forecasting*"]
