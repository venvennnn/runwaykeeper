[project]
name = "runwaykeeper-agent"
version = "0.1.0"
description = "Strands orchestration for RunwayKeeper"
requires-python = ">=3.11"
dependencies = [
  "strands-agents>=1.54.0,<2",
  "pydantic>=2.9,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["runwaykeeper_agent*"]
